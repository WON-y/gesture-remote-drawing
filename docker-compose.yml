name: airsketch

services:
  edge:
    # CD 가 main 마다 GHCR 에 배포하는 이미지. 직접 빌드(--build)하면 같은 이름으로 로컬에 만들어짐
    image: ghcr.io/won-y/gesture-remote-drawing/edge:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: edge/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}   # http → https 리다이렉트용
    volumes:
      - ./edge/certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro   # 개발 중 HTML 수정 즉시 반영
      - ./data/gallery/images:/data/gallery-images:ro   # 공유된 그림 (DB 는 노출 안 함)
    depends_on:
      c1_gateway:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel: 외부(인터넷)에서 접속할 때만 profile 로 켬. edge:8081 로 연결.
  # 임시 주소(계정·도메인 불필요, 실행마다 바뀜): docker compose --profile quick-tunnel up -d
  tunnel-quick:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate --url http://edge:8081
    depends_on:
      - edge
    restart: unless-stopped
    profiles: [quick-tunnel]

  # 고정 주소(Cloudflare 도메인 + Zero Trust 터널 토큰): docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # 비어 있으면 cloudflared 가 시작하지 못함
    depends_on:
      - edge
    restart: unless-stopped
    profiles: [tunnel]

  c1_gateway:
    image: ghcr.io/won-y/gesture-remote-drawing/c1_gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: c1_gateway/Dockerfile
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      C2_URL: ws://c2_gesture:8001
      SESSION_TTL: ${SESSION_TTL:-3600}
      PLAYER_IDLE_SEC: ${PLAYER_IDLE_SEC:-300}
      GALLERY_DIR: /data/gallery
      GALLERY_MAX_MB: 10   # edge 의 client_max_body_size 와 맞출 것
    volumes:
      - ./data/gallery:/data/gallery   # 공유된 그림 + gallery.db (재빌드해도 유지)
    depends_on:
      c2_gesture:
        condition: service_healthy
    restart: unless-stopped

  c2_gesture:
    image: ghcr.io/won-y/gesture-remote-drawing/c2_gesture:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: c2_gesture/Dockerfile
    environment:
      STABLE_FRAMES: ${STABLE_FRAMES:-3}
      SAVE_FRAMES: ${SAVE_FRAMES:-15}
      CLEAR_FRAMES: ${CLEAR_FRAMES:-30}
      TOGETHER_RATIO: ${TOGETHER_RATIO:-1.2}
      SHAKE_AMP: ${SHAKE_AMP:-0.02}
      SHAKE_TURNS: ${SHAKE_TURNS:-3}
      SHAKE_WINDOW_MS: ${SHAKE_WINDOW_MS:-1000}
      SWIPE_DIST: ${SWIPE_DIST:-0.09}
      DRAW_RELEASE_FRAMES: ${DRAW_RELEASE_FRAMES:-6}
      LOST_GRACE_MS: ${LOST_GRACE_MS:-300}
      THUMB_MARGIN: ${THUMB_MARGIN:-0.2}
      PINCH_RATIO: ${PINCH_RATIO:-0.3}
      PINCH_RELEASE_RATIO: ${PINCH_RELEASE_RATIO:-0.45}
      ACTIVE_MARGIN: ${ACTIVE_MARGIN:-0.1}
      ACTIVE_TOP: ${ACTIVE_TOP:-0.05}
      ACTIVE_BOTTOM: ${ACTIVE_BOTTOM:-0.4}
      FILTER_MIN_CUTOFF: ${FILTER_MIN_CUTOFF:-1.5}
      FILTER_BETA: ${FILTER_BETA:-5.0}
    restart: unless-stopped
