# CI: PR·main 푸시마다 코드 검사 → 단위 테스트 → 전체 서비스 통합 테스트
# CD: main 에 합쳐지면(테스트 통과 시) Docker 이미지 3개를 GHCR 에 배포
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:  # 같은 브랜치에 새로 푸시하면 이전 실행 취소
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 코드 검사 + 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff (코드 검사)
        run: ruff check .
      - name: pytest (제스처 판정)
        run: pytest -v

  integration:
    name: 통합 테스트 (docker compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 자체 서명 인증서 생성
        run: bash scripts/make-cert.sh localhost
      - name: 전체 서비스 빌드·실행
        run: docker compose up -d --build --wait --wait-timeout 120
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==13.1
      - name: 세션 → 폰 연결 → 랜드마크 → 그림판 제스처 확인
        run: python scripts/smoke_test.py https://localhost
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  publish:
    name: 이미지 배포 (GHCR)
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [edge, c1_gateway, c2_gesture]
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 이름 (GHCR 은 소문자만 허용)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
