# 443(LAN, 자체 서명 TLS) 과 8081(Cloudflare Tunnel) 서버 블록이 공유하는 라우팅.
# 각 server 블록에서 $via_tunnel 을 정해 둬야 함 (빈 값이면 헤더를 보내지 않음).
root /usr/share/nginx/html;

# 컨테이너 내부 포트(443)로 절대 URL 을 만들지 않도록 상대 Location 사용
# (호스트 포트가 8443 등일 때 https://host/... 로 잘못 리다이렉트되는 문제 방지)
absolute_redirect off;

location = / {
    return 302 /canvas.html;
}

location / {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location /api/ {
    client_max_body_size 11m;   # 기본 1m 이면 고해상도 캔버스 PNG 공유가 413 으로 실패
    proxy_pass http://gateway;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Via-Tunnel $via_tunnel;  # 클라이언트가 보낸 값은 덮어씀
}

# 공유된 그림: 파일명이 uuid 라 내용이 바뀌지 않음 → 길게 캐시
location /gallery-files/ {
    alias /data/gallery-images/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}

location /ws/ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
