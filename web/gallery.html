<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team5 갤러리</title>
  <style>
    /* canvas.html 과 같은 폰트·색 */
    @font-face {
      font-family: "ArittaDodum";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Arita-dotum-Medium.woff") format("woff");
      font-weight: 500;
      font-display: swap;
    }
    :root {
      --bar: 56px;
      --mint: #2ec4a6;
      --mint-dark: #13866f;
      --mint-soft: #e6f8f3;
      --mint-line: #b9eadf;
    }
    html, body { margin: 0; min-height: 100%; font-family: "ArittaDodum", system-ui, sans-serif; font-weight: 500;
      color: #1f3a35; background: var(--mint-soft); }
    button, a.btn { padding: 6px 14px; border: 2.5px solid var(--mint); border-radius: 999px; background: #fff;
      color: var(--mint-dark); font: inherit; font-weight: 700; font-size: 13.33px; cursor: pointer;
      text-decoration: none; transition: background .15s, color .15s; }
    button:hover, a.btn:hover { background: var(--mint); color: #fff; }
    button:disabled { opacity: .5; cursor: default; background: #fff; color: var(--mint-dark); }
    button.danger { border-color: #e5484d; color: #e5484d; }
    button.danger:hover { background: #e5484d; color: #fff; }

    #toolbar { position: sticky; top: 0; z-index: 10; height: var(--bar); display: flex; align-items: center; gap: 12px;
      padding: 0 16px; background: var(--mint-soft); border-bottom: 2px solid var(--mint-line); box-sizing: border-box; }
    #toolbar strong { font-size: 20px; font-weight: 700; color: var(--mint-dark); letter-spacing: -.3px; }
    #toolbar .sp { flex: 1; }
    #tabs { display: flex; gap: 6px; }
    #tabs button[aria-selected="true"] { background: var(--mint); color: #fff; }

    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
    #count { margin: 0 0 14px; font-size: 14px; color: #7a8f8a; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { display: block; width: 100%; padding: 0; border: 0; border-radius: 14px; overflow: hidden; text-align: left;
      background: #fff; color: inherit; font-weight: 500; box-shadow: 0 2px 10px rgba(19,134,111,.1);
      transition: transform .15s, box-shadow .15s; }
    .card:hover { background: #fff; color: inherit; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(19,134,111,.18); }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff;
      border-bottom: 2px solid var(--mint-line); }
    .card .meta { padding: 10px 12px; }
    .card .title { font-weight: 700; color: var(--mint-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .sub { margin-top: 2px; font-size: 12px; color: #7a8f8a; display: flex; gap: 6px; align-items: center; }
    .badge { padding: 1px 7px; border-radius: 999px; background: var(--mint-soft); color: var(--mint-dark); font-size: 11px; font-weight: 700; }
    #empty { padding: 60px 0; text-align: center; color: #7a8f8a; }
    #more { display: block; margin: 24px auto 0; }
    #more[hidden] { display: none; }

    #viewer { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box; background: rgba(19,58,53,.6); }
    #viewer[hidden] { display: none; }
    #viewer .box { position: relative; display: flex; flex-direction: column; max-width: 100%; max-height: 100%;
      background: #fff; border-radius: 16px; border-top: 6px solid var(--mint); overflow: hidden;
      box-shadow: 0 10px 40px rgba(19,134,111,.25); }
    #viewer img { display: block; min-height: 0; max-width: min(1100px, 100%); max-height: calc(100vh - 160px); object-fit: contain; }
    #viewer .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 2px solid var(--mint-line); }
    #viewer .info { flex: 1; min-width: 0; }
    #viewer .info b { display: block; color: var(--mint-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #viewer .info span { font-size: 12px; color: #7a8f8a; }
    @media (max-width: 440px) {
      #toolbar { gap: 8px; } #toolbar strong { font-size: 16px; }
      #grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
    #viewer .close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; padding: 0; line-height: 1; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>Team5 갤러리</strong>
    <div id="tabs" role="tablist">
      <button role="tab" data-mine="0" aria-selected="true">전체</button>
      <button role="tab" data-mine="1" aria-selected="false">내 그림</button>
    </div>
    <span class="sp"></span>
    <a class="btn" id="backToCanvas" href="canvas.html">← 그림판</a>
  </div>

  <main>
    <p id="count"></p>
    <div id="grid"></div>
    <div id="empty" hidden></div>
    <button id="more" hidden>더 보기</button>
  </main>

  <div id="viewer" hidden>
    <div class="box" role="dialog" aria-labelledby="viewTitle">
      <button class="close" id="closeViewer" aria-label="닫기">✕</button>
      <img id="viewImg" alt="" />
      <div class="bar">
        <div class="info"><b id="viewTitle"></b><span id="viewSub"></span></div>
        <a class="btn" id="viewDownload">다운로드</a>
        <button class="danger" id="viewDelete">삭제</button>
      </div>
    </div>
  </div>

  <script>
    const PAGE = 24;
    const $grid = document.getElementById("grid");
    const $count = document.getElementById("count");
    const $empty = document.getElementById("empty");
    const $more = document.getElementById("more");
    const $viewer = document.getElementById("viewer");

    // canvas.html 이 공유할 때 쓴 것과 같은 키 → 같은 브라우저에서 올린 그림이 "내 그림"
    function ownerId() {
      let id = localStorage.getItem("gallery.owner");
      if (!id) localStorage.setItem("gallery.owner", (id = crypto.randomUUID()));
      return id;
    }
    const fmtDate = (t) => new Date(t * 1000).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });

    let mine = false;
    let loaded = 0;
    let loading = false;
    let current = null; // 뷰어에 열린 그림

    async function load(reset) {
      if (loading) return;
      loading = true;
      if (reset) { loaded = 0; $grid.replaceChildren(); }
      try {
        const q = new URLSearchParams({ mine, offset: loaded, limit: PAGE });
        const res = await fetch(`/api/gallery?${q}`, { headers: { "X-Owner-Id": ownerId() } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const page = await res.json();
        page.items.forEach((it) => $grid.appendChild(card(it)));
        loaded += page.items.length;
        $count.textContent = page.total ? `${page.total}개의 그림` : "";
        $empty.hidden = page.total > 0;
        $empty.textContent = mine ? "아직 공유한 그림이 없어요. 그림판에서 [공유하기]를 눌러 보세요." : "아직 공유된 그림이 없어요.";
        $more.hidden = loaded >= page.total;
      } catch (e) {
        $empty.hidden = false;
        $empty.textContent = "불러오기 실패: " + e.message;
      } finally {
        loading = false;
      }
    }

    // 제목·닉네임은 사용자 입력 → textContent 로만 넣음
    function card(it) {
      const b = document.createElement("button");
      b.className = "card";
      const img = document.createElement("img");
      img.src = it.thumb_url;
      img.alt = it.title;
      img.loading = "lazy";
      const meta = document.createElement("div");
      meta.className = "meta";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = it.title;
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = `${it.author} · ${fmtDate(it.created)}`;
      if (it.mine) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "내 그림";
        sub.appendChild(badge);
      }
      meta.append(title, sub);
      b.append(img, meta);
      b.onclick = () => openViewer(it, b);
      return b;
    }

    function openViewer(it, el) {
      current = { it, el };
      document.getElementById("viewImg").src = it.url;
      document.getElementById("viewImg").alt = it.title;
      document.getElementById("viewTitle").textContent = it.title;
      document.getElementById("viewSub").textContent = `${it.author} · ${fmtDate(it.created)} · ${it.width}×${it.height}`;
      const $dl = document.getElementById("viewDownload");
      $dl.href = it.url;
      $dl.download = `team5-${it.id.slice(0, 8)}.png`;
      document.getElementById("viewDelete").hidden = !it.mine;
      $viewer.hidden = false;
    }
    function closeViewer() {
      $viewer.hidden = true;
      document.getElementById("viewImg").removeAttribute("src");
      current = null;
    }
    document.getElementById("closeViewer").onclick = closeViewer;
    $viewer.onclick = (e) => { if (e.target === $viewer) closeViewer(); };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$viewer.hidden) closeViewer(); });

    document.getElementById("viewDelete").onclick = async () => {
      if (!current || !confirm(`"${current.it.title}" 그림을 삭제할까요? 되돌릴 수 없어요.`)) return;
      const { it, el } = current;
      const res = await fetch(`/api/gallery/${encodeURIComponent(it.id)}`, {
        method: "DELETE",
        headers: { "X-Owner-Id": ownerId() },
      });
      if (!res.ok) return alert(res.status === 403 ? "내가 올린 그림만 삭제할 수 있어요." : `삭제 실패 (HTTP ${res.status})`);
      closeViewer();
      el.remove();
      loaded--;
      const left = Math.max(0, (parseInt($count.textContent) || 1) - 1);
      $count.textContent = left ? `${left}개의 그림` : "";
      if (!left) load(true);
    };

    document.querySelectorAll("#tabs button").forEach((t) => {
      t.onclick = () => {
        mine = t.dataset.mine === "1";
        document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-selected", x === t));
        load(true);
      };
    });
    $more.onclick = () => load(false);
    // 그림판에서 왔으면 뒤로가기 → 방문 기록이 쌓이지 않고, 그림판은 sessionStorage 로 그림·세션 복원
    document.getElementById("backToCanvas").onclick = (e) => {
      if (new URLSearchParams(location.search).get("from") === "canvas" && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    };
    load(true);
  </script>
</body>
</html>
