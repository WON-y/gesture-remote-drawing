<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirSketch</title>
  <style>
    :root { --bar: 56px; --accent: #4f8cff; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f5f7; overflow: hidden; }
    #toolbar { height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: #fff; border-bottom: 1px solid #ddd; box-sizing: border-box; }
    #toolbar .sp { flex: 1; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; cursor: pointer; }
    .swatch.on { box-shadow: 0 0 0 2px var(--accent); }
    button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
    #peer { font-size: 14px; color: #888; }
    #peer.on { color: #1a9c4a; font-weight: 600; }
    #gesture { font-size: 14px; min-width: 70px; }
    #board { position: absolute; top: var(--bar); left: 0; right: 0; bottom: 0; }
    #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #paint { background: #fff; }
    #qr { position: absolute; inset: 0; margin: auto; width: 340px; height: fit-content; padding: 24px;
      background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.15); text-align: center; z-index: 10; }
    #qr svg { width: 260px; height: 260px; }
    #qr a { font-size: 12px; word-break: break-all; color: #666; }
    #help { font-size: 13px; color: #555; text-align: left; line-height: 1.6; }
    #toast { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); padding: 10px 18px;
      background: rgba(0,0,0,.75); color: #fff; border-radius: 999px; font-size: 15px; z-index: 20;
      opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>AirSketch</strong>
    <div id="colors"></div>
    <label>굵기 <input id="width" type="range" min="2" max="30" value="6" /></label>
    <button id="clear">전체 지우기</button>
    <button id="save">PNG 저장</button>
    <button id="showQr">QR</button>
    <span class="sp"></span>
    <span id="gesture">—</span>
    <span id="peer">● 폰 대기 중</span>
  </div>

  <div id="board">
    <canvas id="paint"></canvas>
    <canvas id="cursor"></canvas>
    <div id="toast"></div>
    <div id="qr">
      <h3>폰 카메라로 QR을 스캔하세요</h3>
      <div id="qrImg">세션 생성 중…</div>
      <a id="camUrl" target="_blank"></a>
      <div id="help">
        ☝ 검지만 펴기: 그리기<br />
        ✌ 검지+중지: 커서 이동<br />
        🤏 엄지+검지 끝 맞대기: 지우개<br />
        ✊ 주먹: 대기<br />
        👍 엄지 척: 그림 저장
      </div>
    </div>
  </div>

  <script>
    const COLORS = ["#222222", "#e5484d", "#f5a623", "#30a46c", "#4f8cff", "#8e4ec6"];
    const ERASER_SIZE = 40;
    const SAVE_COOLDOWN = 2000; // ms, 엄지 척 연속 저장 방지
    const LOST_GRACE_MS = 300;  // 서버(c2) LOST_GRACE_MS 와 맞출 것
    let lostTimer;

    const board = document.getElementById("board");
    const paint = document.getElementById("paint");
    const cursor = document.getElementById("cursor");
    const pctx = paint.getContext("2d");
    const cctx = cursor.getContext("2d");
    const $peer = document.getElementById("peer");
    const $gesture = document.getElementById("gesture");
    const $qr = document.getElementById("qr");

    let color = COLORS[0];
    let lastPt = null; // 직전 그리기 좌표 (null 이면 선 끊김)
    let lastMid = null; // 직전 곡선 조각의 끝점 (lastPt 와 그 이전 점의 중점)
    let lastErase = null; // 직전 지우개 좌표 (null 이면 끊김)
    let prevGesture = "none";

    // 곡선은 중점까지만 그리므로, 선이 끝날 때 마지막 점까지 마저 잇는다
    function endStroke() {
      if (lastPt && lastMid) {
        pctx.globalCompositeOperation = "source-over";
        pctx.beginPath();
        pctx.moveTo(lastMid.x, lastMid.y);
        pctx.lineTo(lastPt.x, lastPt.y);
        pctx.stroke();
      }
      lastPt = lastMid = lastErase = null;
    }
    let lastSave = 0;

    // ---- 툴바 ----
    const $colors = document.getElementById("colors");
    $colors.style.display = "flex";
    $colors.style.gap = "8px";
    COLORS.forEach((c, i) => {
      const s = document.createElement("div");
      s.className = "swatch" + (i === 0 ? " on" : "");
      s.style.background = c;
      s.onclick = () => {
        color = c;
        document.querySelectorAll(".swatch").forEach((e) => e.classList.remove("on"));
        s.classList.add("on");
      };
      $colors.appendChild(s);
    });
    document.getElementById("clear").onclick = () => pctx.clearRect(0, 0, paint.width, paint.height);
    function saveDrawing() {
      // 지운 부분이 투명으로 남지 않도록 흰 배경에 합성
      const out = document.createElement("canvas");
      out.width = paint.width; out.height = paint.height;
      const octx = out.getContext("2d");
      octx.fillStyle = "#fff";
      octx.fillRect(0, 0, out.width, out.height);
      octx.drawImage(paint, 0, 0);
      const d = new Date(), p2 = (n) => String(n).padStart(2, "0");
      const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
      const a = document.createElement("a");
      a.download = `airsketch-${stamp}.png`;
      a.href = out.toDataURL("image/png");
      a.click();
      showToast(`💾 ${a.download} 저장됨`);
    }
    let toastTimer;
    function showToast(text) {
      const $t = document.getElementById("toast");
      $t.textContent = text;
      $t.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $t.classList.remove("on"), 2000);
    }
    document.getElementById("save").onclick = saveDrawing;
    document.getElementById("showQr").onclick = () => ($qr.hidden = !$qr.hidden);

    // ---- 캔버스 크기 (DPR 대응, 리사이즈 시 내용 유지) ----
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = board.clientWidth, h = board.clientHeight;
      const tmp = document.createElement("canvas");
      tmp.width = paint.width; tmp.height = paint.height;
      tmp.getContext("2d").drawImage(paint, 0, 0);
      for (const c of [paint, cursor]) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
        c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      pctx.drawImage(tmp, 0, 0, w, h);
    }
    window.addEventListener("resize", resize);
    resize();

    // ---- 제스처 처리 ----
    const LABEL = { none: "—", idle: "✊ 대기", hover: "✌ 이동", draw: "☝ 그리기", erase: "🤏 지우개", save: "👍 저장" };
    // MediaPipe 손 랜드마크 연결선 (손목 0 → 각 손가락)
    const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

    // 손 골격은 cursor 레이어에만 그림 → 매 프레임 지워지고 PNG 저장에도 안 들어감
    function drawHand(lm, w, h) {
      if (!lm) return;
      cctx.strokeStyle = "rgba(79,140,255,.5)";
      cctx.lineWidth = 2;
      cctx.beginPath();
      for (const [a, b] of HAND_CONNECTIONS) {
        cctx.moveTo(lm[a][0] * w, lm[a][1] * h);
        cctx.lineTo(lm[b][0] * w, lm[b][1] * h);
      }
      cctx.stroke();
      cctx.fillStyle = "#4f8cff";
      for (const [x, y] of lm) {
        cctx.beginPath();
        cctx.arc(x * w, y * h, 3, 0, Math.PI * 2);
        cctx.fill();
      }
    }

    function onGesture(ev) {
      $gesture.textContent = LABEL[ev.gesture] ?? ev.gesture;
      // 엄지 척으로 바뀌는 순간 1회 저장
      if (ev.gesture === "save" && prevGesture !== "save" && performance.now() - lastSave > SAVE_COOLDOWN) {
        lastSave = performance.now();
        saveDrawing();
      }
      prevGesture = ev.gesture;
      const w = board.clientWidth, h = board.clientHeight;
      cctx.clearRect(0, 0, w, h);
      drawHand(ev.landmarks, w, h);
      clearTimeout(lostTimer);
      if (ev.x == null) {
        // 손을 잠깐 놓친 경우: 곧 다시 그리면 같은 선으로 이어지도록 바로 끝내지 않음
        lostTimer = setTimeout(endStroke, LOST_GRACE_MS);
        return;
      }

      const pt = { x: ev.x * w, y: ev.y * h };
      const width = +document.getElementById("width").value;

      if (ev.gesture === "draw") {
        pctx.globalCompositeOperation = "source-over";
        pctx.strokeStyle = color;
        pctx.lineWidth = width;
        pctx.lineCap = pctx.lineJoin = "round";
        pctx.beginPath();
        if (!lastPt) {
          // 시작점: 점 하나 찍기
          pctx.moveTo(pt.x, pt.y);
          pctx.lineTo(pt.x, pt.y);
          lastMid = pt;
        } else {
          // 직전 점을 제어점으로, 중점 → 중점 2차 곡선 (꺾임 없이 이어짐)
          const mid = { x: (lastPt.x + pt.x) / 2, y: (lastPt.y + pt.y) / 2 };
          pctx.moveTo(lastMid.x, lastMid.y);
          pctx.quadraticCurveTo(lastPt.x, lastPt.y, mid.x, mid.y);
          lastMid = mid;
        }
        pctx.stroke();
        lastPt = pt;
      } else if (ev.gesture === "erase") {
        if (lastPt) endStroke(); // 그리던 선만 마무리 (지우개 연결점은 유지)
        // 프레임마다 원만 찍으면 빠르게 움직일 때 원 사이가 비므로, 직전 점과 굵은 선으로 잇는다
        const from = lastErase ?? pt;
        pctx.globalCompositeOperation = "destination-out";
        pctx.lineWidth = ERASER_SIZE * 2;
        pctx.lineCap = pctx.lineJoin = "round";
        pctx.beginPath();
        pctx.moveTo(from.x, from.y);
        pctx.lineTo(pt.x, pt.y);
        pctx.stroke();
        pctx.globalCompositeOperation = "source-over";
        lastErase = pt;
      } else {
        endStroke();
      }

      // 커서
      const r = ev.gesture === "erase" ? ERASER_SIZE : Math.max(width / 2, 4);
      cctx.beginPath();
      cctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      cctx.strokeStyle = ev.gesture === "draw" ? color : "#999";
      cctx.lineWidth = 2;
      cctx.stroke();
    }

    function onPeer(ev) {
      if (ev.role !== "cam") return;
      const on = ev.state === "joined";
      $peer.textContent = on ? "● 폰 연결됨" : "● 폰 대기 중";
      $peer.classList.toggle("on", on);
      $qr.hidden = on;
      if (!on) { endStroke(); cctx.clearRect(0, 0, cursor.width, cursor.height); }
    }

    // ---- 세션 + WebSocket ----
    async function start() {
      const res = await fetch("/api/session", { method: "POST" });
      const info = await res.json();
      document.getElementById("qrImg").innerHTML = info.qr_svg;
      const $a = document.getElementById("camUrl");
      $a.href = $a.textContent = info.cam_url;

      const connect = () => {
        const ws = new WebSocket(`wss://${location.host}/ws/canvas/${info.session_id}`);
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === "gesture") onGesture(msg);
          else if (msg.type === "peer") onPeer(msg);
        };
        ws.onclose = (e) => {
          if (e.code === 4409) return; // 다른 탭이 이 세션을 가져감
          setTimeout(connect, 1000);
        };
      };
      connect();
    }
    start().catch((e) => (document.getElementById("qrImg").textContent = "세션 생성 실패: " + e.message));
  </script>
</body>
</html>
